services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=parsewell
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
